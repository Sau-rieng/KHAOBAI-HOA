<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khảo Sát Hóa Học THPT</title>
  <style>
    :root { --primary: #1e3a8a; --secondary: #0284c7; --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; --green: #16a34a; --red: #dc2626; --text: #0f172a; }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; margin: 0; line-height: 1.5; }
    .container { max-width: 850px; margin: 0 auto; background: var(--card); border-radius: 12px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .hidden { display: none !important; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 15px; }
    input[type="text"], input[type="number"] { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 16px; }
    .btn { background: var(--primary); color: #fff; border: none; padding: 14px 20px; font-size: 16px; border-radius: 8px; font-weight: 600; cursor: pointer; width: 100%; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .btn-green { background: var(--green); margin-top: 12px; }
    .question-box { border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; background: #fff; }
    .part-title { color: var(--primary); border-bottom: 2px solid var(--border); padding-bottom: 6px; margin-top: 24px; margin-bottom: 14px; font-size: 18px; }
    .opt-label { display: block; padding: 12px; margin: 8px 0; border: 1px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 15px; }
    .opt-label input { margin-right: 12px; transform: scale(1.2); }
    .tf-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 15px; }
    .tf-options label { margin-left: 14px; cursor: pointer; font-weight: 600; }
    .explanation { margin-top: 12px; padding: 12px; background: #eff6ff; border-left: 4px solid var(--secondary); font-size: 14px; }
    .badge { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: bold; font-size: 13px; margin-bottom: 8px; }
    .badge-pass { background: #dcfce7; color: var(--green); }
    .badge-fail { background: #fee2e2; color: var(--red); }
    .alert-box { background: #fffbeb; border: 2px solid #f59e0b; color: #d97706; padding: 12px; border-radius: 8px; margin-bottom: 16px; font-weight: bold; text-align: center; }
    .teacher-box { background: #f0fdf4; border: 2px solid var(--green); border-radius: 10px; padding: 16px; margin-bottom: 20px; }
    .exam-header-sticky { position: sticky; top: 0; background: #fff; z-index: 99; border-bottom: 2px solid var(--border); padding: 12px 0; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    .timer-badge { background: var(--red); color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
<div class="container">
  <div id="screen-info">
    <h2 style="color:var(--primary); margin-top:0; text-align:center;">Khảo Sát Kiến Thức Hóa Học</h2>
    
    <div id="teacherControlPanel" class="teacher-box hidden">
      <h3 style="margin-top:0; color:var(--green);">👨‍🏫 Quản Trị Giáo Viên</h3>
      <div class="form-group">
        <label>1. Cài đặt thời gian làm bài (Phút):</label>
        <input type="number" id="gvSetMinutes" value="15">
      </div>
      <div class="form-group">
        <label>2. Đặt mã mở phòng thi (Đọc mã này cho học sinh khi bắt đầu):</label>
        <input type="text" id="gvSetPasscode" value="HOA12">
      </div>
      <button type="button" class="btn btn-green" onclick="saveTeacherConfig()">Kích Hoạt Thiết Lập Phòng Thi</button>
    </div>

    <div class="alert-box">
      ⚠️ HỌC SINH LƯU Ý: Nút làm bài chỉ mở khi Giáo viên cung cấp "Mã mở phòng thi" trực tiếp tại lớp.
    </div>

    <div class="form-group">
      <label>Họ và tên học sinh:</label>
      <input type="text" id="stuName" placeholder="Nhập đầy đủ họ tên...">
    </div>
    <div class="form-group">
      <label>Lớp / Số máy:</label>
      <input type="text" id="stuClass" placeholder="Ví dụ: 12A1 - Máy 05">
    </div>
    <div class="form-group">
      <label style="color: var(--red);">Mã mở phòng thi (Do GV đọc tại lớp):</label>
      <input type="text" id="roomPasscode" placeholder="Nhập mã mở phòng..." oninput="checkPasscode()">
    </div>
    <div style="margin-bottom: 16px; font-weight: 600; color: #475569; font-size: 14px;">
      Thời gian làm bài: <span id="currentDurationDisplay" style="color:var(--primary); font-size:16px;">Chờ GV kích hoạt</span>
    </div>

    <button class="btn" id="btnStartTest" onclick="startTest()" disabled>Vui Lòng Nhập Đúng Mã Phòng Để Làm Bài</button>
  </div>

  <div id="screen-exam" class="hidden">
    <div class="exam-header-sticky">
      <div>
        <b id="examHeader" style="color:var(--primary); font-size:17px; display:block;"></b>
        <span id="cheatWarning" style="color:var(--red); font-weight:bold; font-size:13px; display: none;"></span>
      </div>
      <div class="timer-badge" id="timerBadge">00:00</div>
    </div>
    <div id="examContainer"></div>
    <button class="btn btn-green" id="btnSubmitExam" onclick="submitExam(false)">Nộp Bài Khảo Sát</button>
  </div>

  <div id="screen-result" class="hidden">
    <h2 style="color:var(--green); margin-top:0; text-align:center;">Đã Hoàn Thành Bài Khảo Sát!</h2>
    <div style="background: #f1f5f9; padding: 16px; border-radius: 8px; margin-bottom: 20px; text-align: center;">
      <p style="margin: 0 0 10px 0;">Thí sinh: <b id="resName"></b> | Lớp: <span id="resClass"></span></p>
      <p style="margin: 0; font-size: 20px;">Điểm số: <b id="resScore" style="color:var(--red); font-size: 32px;"></b></p>
      <p id="resCheat" style="color:var(--red); font-weight:bold; font-size:15px; margin-top: 10px;"></p>
    </div>
    <div id="syncStatus" style="font-weight:600; margin-bottom: 16px; color: var(--secondary); text-align: center;">Đang gửi bảng điểm về máy Giáo viên...</div>
    <div id="reviewContainer"></div>
    <button class="btn btn-secondary" onclick="location.reload()">Làm Lượt Mới</button>
  </div>
</div>

<script>
  const FORMSPREE_URL = "https://formspree.io/f/mgaebavp";
  let durationMinutes = parseInt(localStorage.getItem("gv_exam_duration")) || 15;
  let activePasscode = localStorage.getItem("gv_exam_passcode") || "HOA12";
  let timerInterval = null;
  let secondsLeft = 0;
  let isExamActive = false;
  let cheatCount = 0;

  window.addEventListener("DOMContentLoaded", () => {
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('gv') === '1') {
      document.getElementById('teacherControlPanel').classList.remove('hidden');
    }
    document.getElementById('currentDurationDisplay').innerText = durationMinutes + " phút";
    document.getElementById('gvSetMinutes').value = durationMinutes;
    document.getElementById('gvSetPasscode').value = activePasscode;
  });

  function saveTeacherConfig() {
    durationMinutes = parseInt(document.getElementById('gvSetMinutes').value, 10) || 15;
    activePasscode = document.getElementById('gvSetPasscode').value.trim() || "HOA12";
    localStorage.setItem("gv_exam_duration", durationMinutes);
    localStorage.setItem("gv_exam_passcode", activePasscode);
    document.getElementById('currentDurationDisplay').innerText = durationMinutes + " phút";
    alert(`Đã lưu! Thời gian: ${durationMinutes} phút. Mã mở phòng là: ${activePasscode}`);
  }

  function checkPasscode() {
    const inputCode = document.getElementById('roomPasscode').value.trim();
    const btn = document.getElementById('btnStartTest');
    if (inputCode.toUpperCase() === activePasscode.toUpperCase()) {
      btn.disabled = false;
      btn.innerText = "Bắt Đầu Làm Bài";
    } else {
      btn.disabled = true;
      btn.innerText = "Vui Lòng Nhập Đúng Mã Phòng Để Làm Bài";
    }
  }

  document.addEventListener("visibilitychange", () => {
    if (document.hidden && isExamActive) {
      cheatCount++;
      const cheatLabel = document.getElementById('cheatWarning');
      cheatLabel.style.display = "block";
      cheatLabel.innerText = `Cảnh báo vi phạm: ${cheatCount} lần`;
      alert("⚠️ CẢNH BÁO: Em vừa rời khỏi màn hình làm bài! Vi phạm đã được ghi lại.");
    }
  });

  function shuffle(arr) {
    let a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const bank_fib = [
    { id: 101, type: "fib", text: "Ester no, đơn chức, mạch hở có công thức chung là CnH2nO2 với điều kiện số nguyên tử C là n >= ___ (điền số).", correct: "2", explain: "Phân tử nhỏ nhất là HCOOCH3 (2 C), do đó n >= 2." },
    { id: 102, type: "fib", text: "Phản ứng thủy phân ester trong môi trường kiềm (đun nóng) còn được gọi là phản ứng ___ hóa.", correct: "xà phòng", explain: "Thủy phân trong kiềm là phản ứng một chiều, gọi là phản ứng xà phòng hóa." },
    { id: 103, type: "fib", text: "Thủy phân hoàn toàn 1 mol phenyl acetate (CH3COOC6H5) bằng dung dịch NaOH dư cần tối đa ___ mol NaOH (điền số).", correct: "2", explain: "Ester của phenol sinh ra natri phenolate tiếp tục phản ứng với NaOH, tổng cần 2 mol NaOH." },
    { id: 104, type: "fib", text: "Đa số ester ở điều kiện thường nhẹ hơn ___ (điền tên chất) và rất ít tan trong dung môi này.", correct: "nước", explain: "Các ester thông thường có khối lượng riêng nhỏ hơn 1 g/cm3 và ít tan trong nước." },
    { id: 105, type: "fib", text: "Phản ứng ester hóa giữa acid và alcohol xúc tác H2SO4 đặc là phản ứng ___ (thuận nghịch hay một chiều).", correct: "thuận nghịch", explain: "Phản ứng ester hóa là phản ứng thuận nghịch hai chiều." },
    { id: 106, type: "fib", text: "Chất béo là triester của carboxylic acid mạch dài, không phân nhánh với ___ (điền tên alcohol).", correct: "glixerol", explain: "Chất béo (triglyceride) là triester của glycerol với các acid béo." },
    { id: 107, type: "fib", text: "Ester isoamyl acetate có mùi thơm đặc trưng của quả ___ chín (điền tên quả).", correct: "chuối", explain: "Isoamyl acetate có mùi chuối chín." },
    { id: 108, type: "fib", text: "Ester benzyl acetate có mùi thơm đặc trưng của hoa ___ (điền tên hoa).", correct: "nhài", explain: "Benzyl acetate mang mùi thơm hoa nhài." },
    { id: 109, type: "fib", text: "Trong phân tử ester no, đơn chức, mạch hở chứa đúng ___ liên kết pi (điền số).", correct: "1", explain: "Chỉ có 1 liên kết pi nằm ở nhóm C=O của chức ester." },
    { id: 110, type: "fib", text: "Thủy phân methyl formate thu được alcohol có tên là ___ (điền tên alcohol).", correct: "metanol", explain: "HCOOCH3 + H2O <-> HCOOH + CH3OH (methanol)." },
    { id: 111, type: "fib", text: "Ester đơn chức có khả năng tham gia phản ứng tráng bạc phải chứa gốc acid mang tên ___ (điền tên gốc acid).", correct: "fomat", explain: "Gốc formate (HCOO-) giữ nhóm aldehyde (-CHO) nên tráng bạc được." },
    { id: 112, type: "fib", text: "Chất béo chứa chủ yếu các gốc acid béo no ở trạng thái ___ ở điều kiện thường (rắn hay lỏng).", correct: "rắn", explain: "Chất béo no (như mỡ động vật) thường ở trạng thái rắn." }
  ];

  const bank_tf = [
    {
      id: 201, type: "tf", text: "Cho ester có công thức CH3COOCH=CH2 (vinyl acetate):",
      items: [
        { label: "a) Phân tử có phản ứng cộng làm mất màu nước bromine.", correct: "Đ" },
        { label: "b) Thủy phân trong kiềm sinh ra muối và aldehyde axetic.", correct: "Đ" },
        { label: "c) Thủy phân sinh ra ethyl alcohol.", correct: "S" },
        { label: "d) Có khả năng trùng hợp tạo polymer.", correct: "Đ" }
      ], explain: "Gốc vinyl gắn trực tiếp vào oxi tạo alcohol không bền chuyển thành aldehyde CH3CHO."
    },
    {
      id: 202, type: "tf", text: "Xét thí nghiệm điều chế ethyl acetate:",
      items: [
        { label: "a) H2SO4 đặc vừa là chất xúc tác vừa có vai trò hút nước.", correct: "Đ" },
        { label: "b) Thêm NaCl bão hòa để tăng khối lượng riêng lớp dưới, giúp ester tách lớp.", correct: "Đ" },
        { label: "c) Lớp ester nhẹ hơn sẽ nổi lên trên.", correct: "Đ" },
        { label: "d) Có thể thay H2SO4 đặc bằng HCl đặc với hiệu suất tương đương.", correct: "S" }
      ], explain: "HCl dễ bay hơi và không háo nước mạnh như H2SO4 đặc."
    },
    {
      id: 203, type: "tf", text: "Xét tính chất vật lý của ester:",
      items: [
        { label: "a) Nhiệt độ sôi của ester thấp hơn carboxylic acid có cùng số C.", correct: "Đ" },
        { label: "b) Giữa các phân tử ester có liên kết hydrogen liên phân tử bền vững.", correct: "S" },
        { label: "c) Đa số ester hòa tan tốt nhiều chất hữu cơ nên dùng làm dung môi.", correct: "Đ" },
        { label: "d) Tất cả ester đều ở thể lỏng ở nhiệt độ thường.", correct: "S" }
      ], explain: "Ester không tạo được liên kết hydrogen liên phân tử; chất béo rắn ở thể rắn."
    },
    {
      id: 204, type: "tf", text: "Cấu tạo và phản ứng của ester:",
      items: [
        { label: "a) Phản ứng thủy phân trong môi trường acid là phản ứng thuận nghịch.", correct: "Đ" },
        { label: "b) Mọi ester đơn chức khi thủy phân đều sinh ra đúng 1 alcohol.", correct: "S" },
        { label: "c) Ester formate có khả năng tráng bạc.", correct: "Đ" },
        { label: "d) Phản ứng xà phòng hóa luôn là phản ứng một chiều.", correct: "Đ" }
      ], explain: "Ester của phenol sinh ra 2 muối, ester vinyl sinh ra aldehyde chứ không tạo alcohol."
    }
  ];

  const bank_mcq = [
    { id: 301, type: "mcq", text: "Hợp chất nào sau đây là ester no, đơn chức, mạch hở?", options: ["CH3COOCH3", "CH2=CHCOOCH3", "HCOOCH=CH2", "CH3COOH"], correct: "CH3COOCH3", explain: "CH3COOCH3 có CTPT C3H6O2 thỏa mãn CnH2nO2 (n >= 2)." },
    { id: 302, type: "mcq", text: "Tên gọi của ester HCOOCH3 là:", options: ["Methyl formate", "Ethyl formate", "Methyl acetate", "Formic acid"], correct: "Methyl formate", explain: "Gốc methyl + formate = methyl formate." },
    { id: 303, type: "mcq", text: "Ester nào sau đây có mùi chuối chín đặc trưng?", options: ["Isoamyl acetate", "Benzyl acetate", "Ethyl butyrate", "Geranyl acetate"], correct: "Isoamyl acetate", explain: "Isoamyl acetate có mùi chuối chín." },
    { id: 304, type: "mcq", text: "Sản phẩm hữu cơ luôn luôn xuất hiện khi thủy phân ester trong dung dịch NaOH là:", options: ["Muối của carboxylic acid", "Alcohol", "Aldehyde", "Ketone"], correct: "Muối của carboxylic acid", explain: "Luôn thu được muối của acid carboxylic." },
    { id: 305, type: "mcq", text: "Ester nào sau đây có khả năng tham gia phản ứng tráng bạc?", options: ["HCOOC2H5", "CH3COOC2H5", "C2H5COOCH3", "CH3COOCH3"], correct: "HCOOC2H5", explain: "Ester formate có nhóm -CHO nên tráng bạc được." },
    { id: 306, type: "mcq", text: "Đun nóng ethyl propionate với dung dịch NaOH dư thu được muối nào sau đây?", options: ["C2H5COONa", "CH3COONa", "HCOONa", "C3H7COONa"], correct: "C2H5COONa", explain: "C2H5COOC2H5 + NaOH -> C2H5COONa + C2H5OH." },
    { id: 307, type: "mcq", text: "Nhiệt độ sôi của ethyl acetate thấp hơn nhiều so với acetic acid cùng số C vì:", options: ["Ester không tạo được liên kết hydrogen liên phân tử", "Ester có khối lượng phân tử bé hơn", "Ester có tính phân cực mạnh hơn", "Ester tan kém trong nước"], correct: "Ester không tạo được liên kết hydrogen liên phân tử", explain: "Ester không có H linh động nên không tạo liên kết H liên phân tử." },
    { id: 308, type: "mcq", text: "Thủy phân vinyl acetate trong dung dịch kiềm sinh ra sản phẩm gồm muối và:", options: ["Acetaldehyde", "Ethyl alcohol", "Vinyl alcohol", "Acetone"], correct: "Acetaldehyde", explain: "Alcohol sinh ra không bền chuyển thành aldehyde CH3CHO." },
    { id: 309, type: "mcq", text: "Vai trò chính của dung dịch NaCl bão hòa trong thí nghiệm điều chế ester là:", options: ["Tăng khối lượng riêng giúp ester dễ tách lớp", "Xúc tác phản ứng hóa học", "Hút nước chuyển dịch cân bằng", "Trung hòa lượng acid dư"], correct: "Tăng khối lượng riêng giúp ester dễ tách lớp", explain: "NaCl bão hòa làm tăng tỉ trọng lớp chất lỏng bên dưới." },
    { id: 310, type: "mcq", text: "Số liên kết pi (π) trong phân tử ester no, đơn chức, mạch hở là:", options: ["1", "0", "2", "3"], correct: "1", explain: "Chỉ có 1 liên kết pi tại nhóm C=O." }
  ];

  let studentExam = [];
  let studentInfo = {};

  function startTimer() {
    secondsLeft = durationMinutes * 60;
    const badge = document.getElementById('timerBadge');

    timerInterval = setInterval(() => {
      let m = Math.floor(secondsLeft / 60);
      let s = secondsLeft % 60;
      badge.innerText = `${m < 10 ? '0' + m : m}:${s < 10 ? '0' + s : s}`;

      if (secondsLeft <= 60) {
        badge.style.background = "#b91c1c";
      }

      if (secondsLeft <= 0) {
        clearInterval(timerInterval);
        alert("Đã hết thời gian làm bài! Hệ thống tự động thu bài của em.");
        submitExam(true);
      }
      secondsLeft--;
    }, 1000);
  }

  function startTest() {
    const name = document.getElementById('stuName').value.trim();
    const sClass = document.getElementById('stuClass').value.trim();
    if (!name || !sClass) { alert("Vui lòng điền họ tên và lớp/số máy!"); return; }

    studentInfo = { name, sClass };
    document.getElementById('examHeader').innerText = `Học sinh: ${name} (${sClass})`;

    isExamActive = true;
    cheatCount = 0;
    document.getElementById('cheatWarning').style.display = "none";

    const picked_fib = shuffle(bank_fib).slice(0, 4);
    const picked_tf = shuffle(bank_tf).slice(0, 4);
    const picked_mcq = shuffle(bank_mcq).slice(0, 10).map(q => {
      let qCopy = {...q}; qCopy.options = shuffle(q.options); return qCopy;
    });

    studentExam = [
      { partTitle: "PHẦN I: CÂU HỎI ĐIỀN KHUYẾT", list: picked_fib },
      { partTitle: "PHẦN II: TRẮC NGHIỆM ĐÚNG/SAI", list: picked_tf },
      { partTitle: "PHẦN III: TRẮC NGHIỆM 4 LỰA CHỌN", list: picked_mcq }
    ];

    const box = document.getElementById('examContainer');
    box.innerHTML = "";
    let questionCounter = 1;

    studentExam.forEach(part => {
      if (part.list.length === 0) return;
      const pTitle = document.createElement('h3');
      pTitle.className = "part-title";
      pTitle.innerText = part.partTitle;
      box.appendChild(pTitle);

      part.list.forEach(q => {
        const qDiv = document.createElement('div');
        qDiv.className = "question-box";
        let html = `<p><b>Câu ${questionCounter}:</b> ${q.text}</p>`;

        if (q.type === 'fib') {
          html += `<input type="text" id="ans_${q.id}" placeholder="Nhập câu trả lời...">`;
        } else if (q.type === 'mcq') {
          q.options.forEach(opt => {
            html += `<label class="opt-label"><input type="radio" name="q_${q.id}" value="${opt}"> ${opt}</label>`;
          });
        } else if (q.type === 'tf') {
          q.items.forEach((item, iIdx) => {
            html += `
              <div class="tf-item">
                <span>${item.label}</span>
                <div class="tf-options">
                  <label><input type="radio" name="tf_${q.id}_${iIdx}" value="Đ"> Đúng</label>
                  <label><input type="radio" name="tf_${q.id}_${iIdx}" value="S"> Sai</label>
                </div>
              </div>`;
          });
        }
        qDiv.innerHTML = html;
        box.appendChild(qDiv);
        questionCounter++;
      });
    });

    document.getElementById('screen-info').classList.add('hidden');
    document.getElementById('screen-exam').classList.remove('hidden');

    startTimer();
  }

  function submitExam(isAuto = false) {
    if (!isAuto && !confirm("Em có chắc chắn nộp bài không?")) return;

    clearInterval(timerInterval);
    isExamActive = false;
    document.getElementById('btnSubmitExam').disabled = true;

    let totalQuestions = 0;
    let correctCount = 0;
    let reviewData = [];
    let count = 1;
    let wrongList = [];

    studentExam.forEach(part => {
      part.list.forEach(q => {
        totalQuestions++;
        if (q.type === 'fib') {
          const inp = document.getElementById(`ans_${q.id}`);
          const userAns = inp ? inp.value.trim() : "";
          const isRight = (userAns.toLowerCase() === q.correct.toLowerCase());
          if (isRight) correctCount++; else wrongList.push(`Câu ${count}`);
          reviewData.push({ num: count, text: q.text, userAns: userAns || "(Trống)", correct: q.correct, isRight: isRight, explain: q.explain });
        } else if (q.type === 'mcq') {
          const sel = document.querySelector(`input[name="q_${q.id}"]:checked`);
          const userAns = sel ? sel.value : "(Trống)";
          const isRight = (userAns === q.correct);
          if (isRight) correctCount++; else wrongList.push(`Câu ${count}`);
          reviewData.push({ num: count, text: q.text, userAns: userAns, correct: q.correct, isRight: isRight, explain: q.explain });
        } else if (q.type === 'tf') {
          let tfRight = 0;
          let details = [];
          q.items.forEach((item, iIdx) => {
            const sel = document.querySelector(`input[name="tf_${q.id}_${iIdx}"]:checked`);
            const userVal = sel ? sel.value : "-";
            if (userVal === item.correct) tfRight++;
            details.push(`${item.label} (Chọn: ${userVal} - Đ/A: ${item.correct})`);
          });
          const isFull = (tfRight === q.items.length);
          if (isFull) correctCount++; else wrongList.push(`Câu ${count}`);
          reviewData.push({ num: count, text: q.text, userAns: details.join("<br>"), correct: "Tất cả ý đúng", isRight: isFull, explain: q.explain });
        }
        count++;
      });
    });

    const score = ((correctCount / totalQuestions) * 10).toFixed(1);
    const wrongSummary = wrongList.length > 0 ? wrongList.join(", ") : "Làm đúng toàn bộ";

    document.getElementById('resName').innerText = studentInfo.name;
    document.getElementById('resClass').innerText = studentInfo.sClass;
    document.getElementById('resScore').innerText = `${score} / 10`;

    const cheatLabel = document.getElementById('resCheat');
    if (cheatCount > 0) {
      cheatLabel.innerText = `Cảnh báo: Em đã rời khỏi màn hình ${cheatCount} lần.`;
      cheatLabel.style.color = "var(--red)";
    } else {
      cheatLabel.innerText = `Làm bài nghiêm túc (Không vi phạm quy chế).`;
      cheatLabel.style.color = "var(--green)";
    }

    const rBox = document.getElementById('reviewContainer');
    rBox.innerHTML = "";
    reviewData.forEach(r => {
      const b = document.createElement('div');
      b.className = "question-box";
      b.innerHTML = `<span class="badge ${r.isRight ? 'badge-pass' : 'badge-fail'}">${r.isRight ? '✓ ĐÚNG' : '✗ SAI'}</span>
        <p><b>Câu ${r.num}:</b> ${r.text}</p><p><b>Bài làm:</b><br>${r.userAns}</p>
        ${!r.isRight ? `<p style="color:var(--green)"><b>Đáp án:</b> ${r.correct}</p>` : ''}
        <div class="explanation"><b>Giải thích:</b> ${r.explain}</div>`;
      rBox.appendChild(b);
    });

    document.getElementById('screen-exam').classList.add('hidden');
    document.getElementById('screen-result').classList.remove('hidden');

    const payload = {
      ThoiGian: new Date().toLocaleString("vi-VN"),
      HoTen: studentInfo.name,
      Lop_SoMay: studentInfo.sClass,
      ThoiLuongThi: `${durationMinutes} phút`,
      DiemSo: score,
      SoCauDung: `${correctCount}/${totalQuestions}`,
      CacCauSai: wrongSummary,
      ViPham: `${cheatCount} lần thoát màn hình`
    };

    fetch(FORMSPREE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify(payload)
    }).then(res => {
      if (res.ok) {
        document.getElementById('syncStatus').innerHTML = `<span style="color:var(--green)">✓ Đã nộp bảng điểm và báo cáo về máy Giáo viên!</span>`;
      } else {
        document.getElementById('syncStatus').innerHTML = `<span style="color:var(--red)">Lỗi kết nối mạng khi lưu bài.</span>`;
      }
    }).catch(err => {
      document.getElementById('syncStatus').innerHTML = `<span style="color:var(--red)">Lỗi: ${err}</span>`;
    });
  }
</script>
